services:
  - type: web
    name: HeroesDelCorazon-pabon-1
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        value: https://heroesdelcorazon-pabon.onrender.com

  - type: web
    name: HeroesDelCorazon-pabon
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/docker/Dockerfile
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: heroesdelcorazon-pabon.onrender.com
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-pabon
          property: connectionString
      - key: FRONTEND_BASE_URL
        value: https://heroesdelcorazon-pabon-1.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://heroesdelcorazon-pabon-1.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://heroesdelcorazon-pabon-1.onrender.com
