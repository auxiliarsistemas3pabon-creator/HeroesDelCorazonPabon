# Temporary override for the one-time PostgreSQL -> local SQL Server transfer.
# Start PostgreSQL with docker compose up -d db, then run the transfer with this override.
services:
  backend:
    environment:
      DATABASE_ENGINE: mssql
      SQLSERVER_DB: ${SQLSERVER_DB:-heroesdelcorazon}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-host.docker.internal}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DRIVER: ${SQLSERVER_DRIVER:-ODBC Driver 18 for SQL Server}
      SQLSERVER_EXTRA_PARAMS: "${SQLSERVER_EXTRA_PARAMS:-Encrypt=yes;TrustServerCertificate=yes}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
